<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sigla Tala — Patient Dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===================== APP HEADER ===================== -->
  <header class="app-header" id="appHeader">
    <div class="app-header-inner">
      <div class="brand">
        <div class="logo logo-sm">S</div>
        <span class="brand-name">Sigla Tala</span>
      </div>

      <div class="user-menu" id="userMenu">
        <button class="user-menu-trigger" id="userMenuTrigger" aria-haspopup="true" aria-expanded="false">
          <svg class="icon icon-invert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="12" cy="8" r="3.4"/>
            <path d="M4.5 20c1.4-3.6 4.4-5.6 7.5-5.6s6.1 2 7.5 5.6"/>
          </svg>
          <span id="userMenuName">Account</span>
          <svg class="icon icon-invert icon-chevron" id="userMenuChevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>

        <div class="user-dropdown hidden" id="userDropdown">
          <div class="user-dropdown-header">
            <div class="user-dropdown-name" id="dropdownName">—</div>
            <div class="user-dropdown-email" id="dropdownEmail">—</div>
          </div>

          <div class="user-dropdown-divider"></div>

          <button class="user-dropdown-item" data-view="dashboard">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <rect x="3" y="3" width="8" height="8" rx="1.5"/>
              <rect x="13" y="3" width="8" height="8" rx="1.5"/>
              <rect x="3" y="13" width="8" height="8" rx="1.5"/>
              <rect x="13" y="13" width="8" height="8" rx="1.5"/>
            </svg>
            Dashboard
          </button>

          <button class="user-dropdown-item" data-view="appointment">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <rect x="3" y="5" width="18" height="16" rx="2"/>
              <path d="M3 10h18M8 3v4M16 3v4"/>
            </svg>
            Appointment
          </button>

          <button class="user-dropdown-item" data-view="account">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <circle cx="12" cy="8" r="3.4"/>
              <path d="M4.5 20c1.4-3.6 4.4-5.6 7.5-5.6s6.1 2 7.5 5.6"/>
            </svg>
            Account Overview
          </button>

          <div class="user-dropdown-divider"></div>

          <button class="user-dropdown-item item-danger" id="logOutBtn">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M9 4H6a2 2 0 00-2 2v12a2 2 0 002 2h3M16 16l4-4-4-4M20 12H9"/>
            </svg>
            Log Out
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ===================== PATIENT DASHBOARD ===================== -->
  <main class="app-content" id="appContent">

    <!-- ---------- Dashboard view ---------- -->
    <section class="view" id="dashboardView">
      <h2 class="view-title">
        <svg class="icon icon-title" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M3 11l16-6-4 16-5-6-6-1z"/>
          <path d="M9.5 14.5L21 5"/>
        </svg>
        Center Announcements
      </h2>

      <div class="announcement-grid" id="announcementGrid"></div>
    </section>

    <!-- ---------- Appointment view ---------- -->
    <section class="view hidden" id="appointmentView">
      <div class="appointment-layout">

        <div class="panel">
          <h2 class="view-title">
            <svg class="icon icon-title" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <rect x="3" y="5" width="18" height="16" rx="2"/>
              <path d="M3 10h18M8 3v4M16 3v4"/>
            </svg>
            Book Appointment
          </h2>

          <form id="appointmentForm" novalidate>
            <div class="field">
              <label for="apptType">Appointment Type</label>
              <select id="apptType" required>
                <option value="" disabled selected>Select type of appointment...</option>
                <option value="general" data-job-specification="General Practitioner">General Consultation</option>
                <option value="vaccination" data-job-specification="Vaccinator">Vaccination</option>
                <option value="prenatal" data-job-specification="General Practitioner">Prenatal Check-up</option>
                <option value="dental" data-job-specification="Dentist">Dental</option>
                <option value="pediatric" data-job-specification="Pediatrician">Pediatric Consultation</option>
                <option value="other" data-job-specification="Health Care workers">Other</option>
              </select>
              <p class="field-hint" id="apptProvider">Assigned to: Select an appointment type</p>
              <span class="error-message" id="apptTypeError"></span>
            </div>

            <section class="appointment-requirements hidden" id="apptRequirements" aria-live="polite">
              <h3 id="apptRequirementsTitle">Documents to bring</h3>
              <ul id="apptRequirementsList"></ul>
            </section>

            <div class="field hidden" id="otherAppointmentReasonField">
              <label for="otherAppointmentReason">Why are you choosing Other?</label>
              <textarea id="otherAppointmentReason" maxlength="500" rows="3" placeholder="Briefly describe the reason for your appointment"></textarea>
              <span class="error-message" id="otherAppointmentReasonError"></span>
            </div>

            <div class="field">
              <label for="apptDate">Select Date</label>
              <input type="date" id="apptDate" required>
              <span class="error-message" id="apptDateError"></span>
            </div>

            <div class="field">
              <label for="apptTime">Time Preference</label>
              <select id="apptTime" required>
                <option value="" disabled selected>Select time preference...</option>
                <option value="7:00 - 7:30">7:00 - 7:30</option>
                <option value="7:30 - 8:00">7:30 - 8:00</option>
                <option value="8:00 - 8:30">8:00 - 8:30</option>
                <option value="8:30 - 9:00">8:30 - 9:00</option>
                <option value="9:00 - 9:30">9:00 - 9:30</option>
                <option value="9:30 - 10:00">9:30 - 10:00</option>
                <option value="10:00 - 10:30">10:00 - 10:30</option>
                <option value="10:30 - 11:00">10:30 - 11:00</option>
                <option value="11:00 - 11:30">11:00 - 11:30</option>
                <option value="11:30 - 12:00">11:30 - 12:00</option>
                <option value="12:00 - 12:30">12:00 - 12:30</option>
                <option value="12:30 - 1:00">12:30 - 1:00</option>
                <option value="1:00 - 1:30">1:00 - 1:30</option>
                <option value="1:30 - 2:00">1:30 - 2:00</option>
                <option value="2:00 - 2:30">2:00 - 2:30</option>
                <option value="2:30 - 3:00">2:30 - 3:00</option>
                <option value="3:00 - 3:30">3:00 - 3:30</option>
                <option value="3:30 - 4:00">3:30 - 4:00</option>
                <option value="4:00 - 4:30">4:00 - 4:30</option>
                <option value="4:30 - 5:00">4:30 - 5:00</option>
              </select>
              <span class="error-message" id="apptTimeError"></span>
            </div>

            <div class="field">
              <label>Upload Requirements</label>
              <p class="field-hint">PDF or Image files only.</p>
              <label class="upload-drop" id="uploadDrop" for="apptFile">
                <svg class="icon icon-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                  <path d="M12 16V4M7 9l5-5 5 5"/>
                  <path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"/>
                </svg>
                <span id="uploadDropText">Click to upload files (PDF, images, DOC/DOCX; up to 5 files)</span>
              </label>
              <input type="file" id="apptFile" accept=".pdf,.jpg,.jpeg,.png,.webp,.doc,.docx" multiple hidden>
            </div>

            <button type="submit" class="btn-primary">Save &amp; Submit</button>
          </form>
        </div>

        <div class="panel">
          <h2 class="view-title">
            <svg class="icon icon-title" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 7v5l3.5 2"/>
            </svg>
            My Appointments
          </h2>
          <div id="appointmentsList">
            <p class="empty-state">Loading appointments...</p>
          </div>
        </div>

      </div>
    </section>

    <!-- ---------- Account Overview view ---------- -->
    <section class="view hidden" id="accountView">
      <div class="panel panel-wide">
        <h2 class="view-title">
          <svg class="icon icon-title" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="12" cy="8" r="3.4"/>
            <path d="M4.5 20c1.4-3.6 4.4-5.6 7.5-5.6s6.1 2 7.5 5.6"/>
          </svg>
          Account Overview
        </h2>

        <form id="accountForm" novalidate>
          <div class="field-pair">
            <div class="field">
              <label for="accFullName">Full Name</label>
              <input type="text" id="accFullName">
            </div>
            <div class="field">
              <label for="accEmail">Email Address</label>
              <input type="email" id="accEmail" readonly>
            </div>
          </div>

          <div class="field-trio">
            <div class="field">
              <label for="accDob">Date of Birth</label>
              <input type="date" id="accDob">
            </div>
            <div class="field">
              <label for="accAge">Age</label>
              <input type="number" id="accAge" min="0" max="120">
            </div>
            <div class="field">
              <label for="accGender">Gender</label>
              <select id="accGender">
                <option value="" disabled selected>Select...</option>
                <option value="female">Female</option>
                <option value="male">Male</option>
                <option value="other">Other</option>
                <option value="prefer-not-to-say">Prefer not to say</option>
              </select>
            </div>
          </div>

          <div class="field-pair">
            <div class="field">
              <label for="accAddress">House Address</label>
              <input type="text" id="accAddress" placeholder="123 Street Name">
            </div>
            <div class="field">
              <label for="accBarangay">Barangay</label>
              <input type="text" id="accBarangay" placeholder="Brgy. Health Center">
            </div>
          </div>

          <hr class="divider">
          <button type="submit" class="btn-primary">Save Profile</button>
        </form>
      </div>
    </section>

  </main>

  <div class="toast" id="toast"></div>

  <script src="patient-dashboard.js"></script>
</body>
</html>
