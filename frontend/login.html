<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sigla Tala — Sign In</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

 <main class="page auth-container" id="authPage">

    <!-- ===================== SIGN IN CARD ===================== -->
    <div class="card" id="signinCard">
      <div class="logo">S</div>
      <h1>Sign in to Sigla Tala</h1>
      <p class="subtitle">Barangay Health Care Center</p>

      <form id="signinForm" novalidate>
        <div class="field">
          <label for="signinEmail">Email address</label>
          <input type="email" id="signinEmail" placeholder="you@example.com" required>
          <span class="error-message" id="signinEmailError"></span>
        </div>

        <div class="field">
          <div class="field-row">
            <label for="signinPassword">Password</label>
            <a href="#" class="link-inline" id="forgotPasswordLink">Forgot your password?</a>
          </div>
          <input type="password" id="signinPassword" placeholder="••••••••" required>
          <span class="error-message" id="signinPasswordError"></span>
        </div>

        <button type="submit" class="btn-primary">Sign in</button>
      </form>

      <p class="switch-text">Don't have an account? <a href="#" class="link" id="showSignup">Sign up</a></p>
    </div>

    <!-- ===================== SIGN UP CARD ===================== -->
    <div class="card hidden" id="signupCard">
      <div class="logo">S</div>
      <h1>Create an Account</h1>
      <p class="subtitle">Join Sigla Tala Health Center</p>

      <form id="signupForm" novalidate>
        <div class="field">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" required>
          <span class="error-message" id="fullNameError"></span>
        </div>

        <div class="field-pair">
          <div class="field">
            <label for="age">Age</label>
            <input type="number" id="age" min="0" max="120" required>
            <span class="error-message" id="ageError"></span>
          </div>

          <div class="field">
            <label for="gender">Gender</label>
            <select id="gender" required>
              <option value="" disabled selected>Select...</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
              <option value="other">Other</option>
              <option value="prefer-not-to-say">Prefer not to say</option>
            </select>
            <span class="error-message" id="genderError"></span>
          </div>
        </div>

        <div class="field">
          <label for="signupEmail">Email address</label>
          <input type="email" id="signupEmail" required>
          <span class="error-message" id="signupEmailError"></span>
        </div>

        <div class="field">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" required>
          <span class="error-message" id="signupPasswordError"></span>
        </div>

        <button type="submit" class="btn-primary">Sign up</button>
      </form>

      <p class="switch-text">Already have an account? <a href="#" class="link" id="showSignin">Sign in</a></p>
    </div>

  </main>

  <div class="toast" id="toast"></div>

  <script src="auth.js"></script>
</body>
</html>
